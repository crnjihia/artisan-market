# path: .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Buf CLI
        uses: bufbuild/buf-setup-action@v1
        with:
          version: '1.34.0'

      - name: Install Node Dependencies
        run: |
          npm install
          npm --prefix backend/gateway install
          npm --prefix backend/notification install
          npm --prefix frontend install

      - name: Generate mTLS Dev Certs
        run: go run scripts/generate-certs.go

      - name: Verify Protobuf Contracts & Breaking Changes
        run: bash scripts/verify-contracts.sh

      - name: Lint Go & TypeScript
        run: make lint

      - name: Run Full Test Suite
        run: make test

      - name: Run Saga E2E Integration Suite
        run: make test-saga
