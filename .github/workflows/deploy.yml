# path: .github/workflows/deploy.yml
name: Deploy to Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Image tag to deploy (defaults to git commit sha)'
        required: false
        default: 'latest'

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: '5.4.1'

      - name: Determine Deployment Tag
        id: vars
        run: |
          ENV="${{ github.event.inputs.environment || 'staging' }}"
          TAG="${{ github.event.inputs.image_tag || 'latest' }}"
          if [ "$TAG" = "latest" ] && [ "${{ github.event_name }}" = "push" ]; then
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "ENV=${ENV}" >> $GITHUB_OUTPUT
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "Target Environment: ${ENV}, Tag: ${TAG}"

      - name: Update Container Image Tags in Kustomization
        run: |
          cd deploy/k8s
          TAG="${{ steps.vars.outputs.TAG }}"
          REGISTRY="ghcr.io/${{ github.repository_owner }}"

          kustomize edit set image artisan/gateway=${REGISTRY}/artisan-gateway:${TAG}
          kustomize edit set image artisan/user=${REGISTRY}/artisan-user:${TAG}
          kustomize edit set image artisan/product=${REGISTRY}/artisan-product:${TAG}
          kustomize edit set image artisan/order=${REGISTRY}/artisan-order:${TAG}
          kustomize edit set image artisan/payment=${REGISTRY}/artisan-payment:${TAG}
          kustomize edit set image artisan/notification=${REGISTRY}/artisan-notification:${TAG}
          cd ../..

      - name: Validate Rendered Manifests
        run: |
          echo "Rendering and verifying Kustomize manifest tree..."
          kubectl kustomize deploy/k8s > dist-manifests.yaml
          cat dist-manifests.yaml | head -n 40

      - name: Configure Kubeconfig
        if: env.HAS_KUBECONFIG == 'true'
        env:
          HAS_KUBECONFIG: ${{ secrets.KUBECONFIG != '' }}
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy to Kubernetes Cluster
        if: env.HAS_KUBECONFIG == 'true'
        env:
          HAS_KUBECONFIG: ${{ secrets.KUBECONFIG != '' }}
        run: |
          echo "Applying manifests to target cluster..."
          kubectl apply -k deploy/k8s

          echo "Awaiting deployment rollouts..."
          for app in gateway user product order payment notification; do
            kubectl rollout status deployment/$app -n artisan-market --timeout=180s
          done

      - name: Dry-Run Mode Output (When No Cluster Secret Configured)
        if: env.HAS_KUBECONFIG != 'true'
        env:
          HAS_KUBECONFIG: ${{ secrets.KUBECONFIG != '' }}
        run: |
          echo "================================================================="
          echo " Dry-Run Validation Passed: Kubernetes & Istio Manifests Valid "
          echo " Set secret KUBECONFIG in GitHub Secrets to execute live deploy. "
          echo "================================================================="

