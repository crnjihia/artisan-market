# path: deploy/k8s/istio/canary-example.yaml
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: product-service-canary
  namespace: artisan-market
spec:
  hosts:
    - product.artisan-market.svc.cluster.local
  http:
    # 1. Beta Canary Evaluation: Route internal beta testers to v2 via HTTP/gRPC metadata header
    - name: canary-beta-tester-route
      match:
        - headers:
            x-canary:
              exact: artisan-beta
      route:
        - destination:
            host: product.artisan-market.svc.cluster.local
            subset: v2
            port:
              number: 50052
    # 2. Weighted Traffic Split: 90% production v1, 10% canary v2
    - name: canary-weighted-split
      route:
        - destination:
            host: product.artisan-market.svc.cluster.local
            subset: v1
            port:
              number: 50052
          weight: 90
        - destination:
            host: product.artisan-market.svc.cluster.local
            subset: v2
            port:
              number: 50052
          weight: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-v2
  namespace: artisan-market
  labels:
    app: product
    app.kubernetes.io/name: product
    app.kubernetes.io/part-of: artisan-market
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
      version: v2
  template:
    metadata:
      labels:
        app: product
        app.kubernetes.io/name: product
        app.kubernetes.io/part-of: artisan-market
        version: v2
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "50052"
    spec:
      serviceAccountName: product-sa
      containers:
        - name: product
          image: artisan/product:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
          envFrom:
            - configMapRef:
                name: artisan-config
          env:
            - name: PORT
              value: "50052"
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@artisan-postgres.database.svc.cluster.local:5432/artisan_product?sslmode=disable"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3

