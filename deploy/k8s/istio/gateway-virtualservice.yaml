# path: deploy/k8s/istio/gateway-virtualservice.yaml
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: artisan-gateway
  namespace: artisan-market
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      tls:
        mode: SIMPLE
        credentialName: artisan-market-tls
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: artisan-ingress-routes
  namespace: artisan-market
spec:
  hosts:
    - "*"
  gateways:
    - artisan-gateway
  http:
    # 1. External Payment Webhook Callbacks (Safaricom M-Pesa Daraja and Stripe)
    - name: payment-webhooks
      match:
        - uri:
            prefix: /mpesa/callback
        - uri:
            prefix: /stripe/webhook
      route:
        - destination:
            host: payment.artisan-market.svc.cluster.local
            port:
              number: 8084
      timeout: 10s
    # 2. Main API Gateway and Health Ingress
    - name: api-gateway
      match:
        - uri:
            prefix: /api/
        - uri:
            exact: /health
      route:
        - destination:
            host: gateway.artisan-market.svc.cluster.local
            port:
              number: 3000
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: "503,gateway-error,connect-failure,refused-stream"
        retryRemoteLocalities: true

