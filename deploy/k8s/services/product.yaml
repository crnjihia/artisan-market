# path: deploy/k8s/services/product.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-sa
  namespace: artisan-market
  labels:
    app: product
    app.kubernetes.io/name: product
    app.kubernetes.io/part-of: artisan-market
---
apiVersion: v1
kind: Service
metadata:
  name: product
  namespace: artisan-market
  labels:
    app: product
    app.kubernetes.io/name: product
    app.kubernetes.io/part-of: artisan-market
spec:
  type: ClusterIP
  selector:
    app: product
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: artisan-market
  labels:
    app: product
    app.kubernetes.io/name: product
    app.kubernetes.io/part-of: artisan-market
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
        app.kubernetes.io/name: product
        app.kubernetes.io/part-of: artisan-market
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "50052"
    spec:
      serviceAccountName: product-sa
      containers:
        - name: product
          image: artisan/product:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: grpc
              containerPort: 50052
              protocol: TCP
          envFrom:
            - configMapRef:
                name: artisan-config
          env:
            - name: PORT
              value: "50052"
            - name: DATABASE_URL
              value: "postgres://postgres:postgres@artisan-postgres.database.svc.cluster.local:5432/artisan_product?sslmode=disable"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 50052
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3

