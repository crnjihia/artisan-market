services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.14
    container_name: artisan-redpanda
    ports:
      - "9092:9092"
      - "8081:8081"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092

  postgres:
    image: postgres:16-alpine
    container_name: artisan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: artisan_market
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-multi-postgres.sql:/docker-entrypoint-initdb.d/init-multi-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: artisan-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: artisan-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "6831:6831/udp"

  mailpit:
    image: axllent/mailpit:v1.18.2
    container_name: artisan-mailpit
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP port
