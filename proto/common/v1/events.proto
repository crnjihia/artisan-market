syntax = "proto3";

package common.v1;

option go_package = "github.com/yourorg/artisan-market/proto/common/v1;commonv1";

// EventMetadata provides W3C distributed tracing context and event provenance.
message EventMetadata {
  string event_id = 1;
  string correlation_id = 2;
  string causation_id = 3;
  int64 timestamp_unix_ms = 4;
  string schema_version = 5;
  string service_origin = 6;
}

// OrderItemReference captures an item within a saga event.
message OrderItemReference {
  string product_id = 1;
  int32 quantity = 2;
  int64 unit_price_cents = 3;
}

// OrderCreatedEvent is emitted by the order service when a buyer submits a checkout.
message OrderCreatedEvent {
  EventMetadata metadata = 1;
  string order_id = 2;
  string user_id = 3;
  repeated OrderItemReference items = 4;
  int64 total_cents = 5;
  string currency = 6; // Fixed to "KES"
  string payment_method = 7; // "mpesa" or "stripe"
  string customer_phone = 8; // e.g., "+254712345678"
  string customer_email = 9;
}

// InventoryReservedEvent is emitted by the product service after reserving stock.
message InventoryReservedEvent {
  EventMetadata metadata = 1;
  string order_id = 2;
  string reservation_id = 3;
  repeated OrderItemReference items = 4;
  int64 reserved_at_unix_ms = 5;
}

// InventoryReservationFailedEvent triggers saga rollback if stock is insufficient.
message InventoryReservationFailedEvent {
  EventMetadata metadata = 1;
  string order_id = 2;
  string reason = 3;
  repeated string out_of_stock_product_ids = 4;
}

// PaymentRequestedEvent initiates an M-Pesa STK push or Stripe intent.
message PaymentRequestedEvent {
  EventMetadata metadata = 1;
  string payment_id = 2;
  string order_id = 3;
  int64 amount_cents = 4;
  string currency = 5; // "KES"
  string payment_method = 6; // "mpesa" or "stripe"
  string customer_phone = 7;
  string customer_email = 8;
}

// PaymentSucceededEvent marks successful payment confirmation.
message PaymentSucceededEvent {
  EventMetadata metadata = 1;
  string payment_id = 2;
  string order_id = 3;
  int64 amount_cents = 4;
  string payment_method = 5;
  string provider_reference = 6; // M-Pesa Receipt Number e.g. "QGH786XYZ"
  int64 completed_at_unix_ms = 7;
}

// PaymentFailedEvent is emitted upon rejection or insufficient funds.
message PaymentFailedEvent {
  EventMetadata metadata = 1;
  string payment_id = 2;
  string order_id = 3;
  string reason = 4;
  string payment_method = 5;
  int64 failed_at_unix_ms = 6;
}

// PaymentTimeoutEvent is emitted if no callback is received before timeout.
message PaymentTimeoutEvent {
  EventMetadata metadata = 1;
  string payment_id = 2;
  string order_id = 3;
  int32 timeout_seconds = 4;
}

// OrderConfirmedEvent finalizes the order saga successfully.
message OrderConfirmedEvent {
  EventMetadata metadata = 1;
  string order_id = 2;
  string payment_id = 3;
  int64 confirmed_at_unix_ms = 4;
}

// OrderCancelledEvent triggers compensation if payment or inventory failed.
message OrderCancelledEvent {
  EventMetadata metadata = 1;
  string order_id = 2;
  string reason = 3;
  int64 cancelled_at_unix_ms = 4;
}

// InventoryReleasedEvent is emitted by the product service to compensate reservations.
message InventoryReleasedEvent {
  EventMetadata metadata = 1;
  string order_id = 2;
  string reservation_id = 3;
  string reason = 4;
  int64 released_at_unix_ms = 5;
}
