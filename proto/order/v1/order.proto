syntax = "proto3";

package order.v1;

option go_package = "github.com/yourorg/artisan-market/proto/order/v1;orderv1";

message OrderItem {
  string product_id = 1;
  string product_name = 2;
  int32 quantity = 3;
  int64 unit_price_cents = 4;
}

message Order {
  string id = 1;
  string user_id = 2;
  repeated OrderItem items = 3;
  int64 total_cents = 4;
  string currency = 5; // Fixed to "KES"
  string status = 6;   // "pending", "reserved", "payment_pending", "confirmed", "cancelled"
  string payment_method = 7; // "mpesa" or "stripe"
  string customer_phone = 8;
  string customer_email = 9;
  string saga_step = 10;
  int64 created_at_unix_ms = 11;
  int64 updated_at_unix_ms = 12;
}

message CreateOrderItem {
  string product_id = 1;
  int32 quantity = 2;
}

message CreateOrderRequest {
  string user_id = 1;
  repeated CreateOrderItem items = 2;
  string payment_method = 3; // "mpesa" or "stripe"
  string customer_phone = 4; // Kenyan standard: +2547XXXXXXXX
  string customer_email = 5;
}

message CreateOrderResponse {
  string order_id = 1;
  string status = 2;
  int64 total_cents = 3;
}

message GetOrderRequest {
  string order_id = 1;
}

message GetOrderResponse {
  Order order = 1;
}

message ListOrdersRequest {
  string user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
}

message CancelOrderRequest {
  string order_id = 1;
  string reason = 2;
}

message CancelOrderResponse {
  bool success = 1;
  string status = 2;
}

service OrderService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder (GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders (ListOrdersRequest) returns (ListOrdersResponse);
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
}
