syntax = "proto3";

package product.v1;

option go_package = "github.com/yourorg/artisan-market/proto/product/v1;productv1";

message Product {
  string id = 1;
  string seller_id = 2;
  string name = 3;
  string description = 4;
  int64 price_cents = 5; // Price in KES cents (e.g. 250000 = KES 2,500.00)
  int32 inventory = 6;
  string category = 7; // e.g. "Carvings", "Baskets", "Beadwork", "Leather"
  string image_url = 8;
  string origin_region = 9; // e.g. "Kisii", "Kitui", "Lamu"
  int64 created_at_unix_ms = 10;
  int64 updated_at_unix_ms = 11;
}

message CreateProductRequest {
  string seller_id = 1;
  string name = 2;
  string description = 3;
  int64 price_cents = 4;
  int32 inventory = 5;
  string category = 6;
  string image_url = 7;
  string origin_region = 8;
}

message CreateProductResponse {
  string product_id = 1;
  Product product = 2;
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message ListProductsRequest {
  int32 limit = 1;
  int32 offset = 2;
  string category = 3;
  string query = 4;
}

message ListProductsResponse {
  repeated Product products = 1;
  int32 total = 2;
}

message UpdateProductRequest {
  string product_id = 1;
  string name = 2;
  string description = 3;
  int64 price_cents = 4;
  int32 inventory = 5;
  string category = 6;
  string image_url = 7;
}

message UpdateProductResponse {
  Product product = 1;
}

message DeleteProductRequest {
  string product_id = 1;
}

message DeleteProductResponse {
  bool success = 1;
}

message ReserveItem {
  string product_id = 1;
  int32 quantity = 2;
}

message ReserveInventoryRequest {
  string order_id = 1;
  repeated ReserveItem items = 2;
}

message ReserveInventoryResponse {
  string reservation_id = 1;
  bool success = 2;
}

message ReleaseInventoryRequest {
  string order_id = 1;
  string reservation_id = 2;
}

message ReleaseInventoryResponse {
  bool success = 1;
}

service ProductService {
  rpc CreateProduct (CreateProductRequest) returns (CreateProductResponse);
  rpc GetProduct (GetProductRequest) returns (GetProductResponse);
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (UpdateProductResponse);
  rpc DeleteProduct (DeleteProductRequest) returns (DeleteProductResponse);
  rpc ReserveInventory (ReserveInventoryRequest) returns (ReserveInventoryResponse);
  rpc ReleaseInventory (ReleaseInventoryRequest) returns (ReleaseInventoryResponse);
}
